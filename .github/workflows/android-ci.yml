# ============================================================
# Android CI/CD — универсальный workflow
# ============================================================
# Что делает:
#   • Push в main/develop  → сборка debug APK + артефакт
#   • Pull Request          → сборка debug APK + проверка
#   • Push тега v*          → подписанный release APK + GitHub Release
#   • workflow_dispatch     → ручной запуск из UI
#
# Требуемые Secrets (для release):
#   KEYSTORE_FILE      — base64 от release-key.jks
#   KEYSTORE_PASSWORD  — пароль keystore
#   KEY_ALIAS          — alias ключа
#   KEY_PASSWORD       — пароль ключа
# ============================================================

name: Android CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  # ──────────────────────────────────────────────
  # 1. Проверка кода (линтеры + юнит-тесты)
  # ──────────────────────────────────────────────
  check:
    name: 🔍 Code Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'buildSrc/**/Versions.kt', 'buildSrc/**/Dependencies.kt', 'gradle/*.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run lint
        run: ./gradlew lintDebug || true

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint/
          retention-days: 7

  # ──────────────────────────────────────────────
  # 2. Сборка Debug APK (push / PR)
  # ──────────────────────────────────────────────
  build-debug:
    name: 📦 Build Debug APK
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'buildSrc/**/Versions.kt', 'buildSrc/**/Dependencies.kt', 'gradle/*.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Get APK info
        id: apk
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SIZE=$(du -h "$APK" | cut -f1)
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "📦 APK size: $SIZE"
          echo "🔑 SHA256: $SHA256"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenMirror-Debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Comment APK size on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📦 Debug APK Ready!\n\n- **Size:** ${{ steps.apk.outputs.size }}\n- **SHA256:** \`${{ steps.apk.outputs.sha256 }}\`\n- **Download:** [Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            })

  # ──────────────────────────────────────────────
  # 3. Сборка подписанного Release APK (теги v*)
  # ──────────────────────────────────────────────
  build-release:
    name: 🔐 Build Signed Release
    needs: check
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'buildSrc/**/Versions.kt', 'buildSrc/**/Dependencies.kt', 'gradle/*.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ KEYSTORE_FILE secret is not set!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release-key.jks
          echo "✅ Keystore decoded"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release-key.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename APK
        run: |
          VERSION=${{ github.ref_name }}
          cp app/build/outputs/apk/release/app-release.apk \
             ScreenMirror-${VERSION}.apk
          echo "📦 Built: ScreenMirror-${VERSION}.apk"
          ls -lh ScreenMirror-*.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenMirror-Release-${{ github.ref_name }}
          path: ScreenMirror-*.apk
          retention-days: 90

  # ──────────────────────────────────────────────
  # 4. Создание GitHub Release
  # ──────────────────────────────────────────────
  create-release:
    name: 🏷️ Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: ScreenMirror-Release-${{ github.ref_name }}

      - name: List files
        run: ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ScreenMirror-*.apk
          generate_release_notes: true
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
