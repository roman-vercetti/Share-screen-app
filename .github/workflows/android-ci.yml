# ============================================================
# Android CI/CD — универсальный workflow
# ============================================================

name: Android CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # 1. Сборка Debug APK (push / PR)
  # ──────────────────────────────────────────────
  build-debug:
    name: 📦 Build Debug APK
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Verify Gradle installation
        run: |
          gradle --version
          echo "✅ Gradle installed successfully"

      - name: List project files
        run: |
          echo "📂 Project structure:"
          ls -la
          echo ""
          echo "📂 App module:"
          ls -la app/ || echo "❌ app/ directory not found"

      - name: Build Debug APK
        run: |
          echo "🔨 Starting build..."
          gradle assembleDebug --stacktrace --info || {
            echo "❌ Build failed!"
            echo "📋 Checking for common issues..."
            if [ ! -f "build.gradle" ]; then
              echo "  ❌ build.gradle not found"
            fi
            if [ ! -f "settings.gradle" ]; then
              echo "  ❌ settings.gradle not found"
            fi
            if [ ! -d "app" ]; then
              echo "  ❌ app/ directory not found"
            fi
            exit 1
          }
          echo "✅ Build completed successfully"

      - name: Verify APK exists
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
            echo "✅ APK built successfully!"
            echo "   Size: $SIZE"
            echo "   SHA256: $SHA256"
            echo "size=$SIZE" >> $GITHUB_OUTPUT
            echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          else
            echo "❌ APK not found at $APK"
            echo "📂 Checking build outputs:"
            find app/build -name "*.apk" 2>/dev/null || echo "No APK files found"
            exit 1
          fi
        id: apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenMirror-Debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Comment APK size on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📦 Debug APK Ready!\n\n- **Size:** ${{ steps.apk.outputs.size }}\n- **SHA256:** \`${{ steps.apk.outputs.sha256 }}\`\n- **Download:** [Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            })

  # ──────────────────────────────────────────────
  # 2. Сборка подписанного Release APK (теги v*)
  # ──────────────────────────────────────────────
  build-release:
    name: 🔐 Build Signed Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ KEYSTORE_FILE secret is not set!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release-key.jks
          echo "✅ Keystore decoded"

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release-key.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename APK
        run: |
          VERSION=${{ github.ref_name }}
          cp app/build/outputs/apk/release/app-release.apk \
             ScreenMirror-${VERSION}.apk
          echo "📦 Built: ScreenMirror-${VERSION}.apk"
          ls -lh ScreenMirror-*.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenMirror-Release-${{ github.ref_name }}
          path: ScreenMirror-*.apk
          retention-days: 90

  # ──────────────────────────────────────────────
  # 3. Создание GitHub Release
  # ──────────────────────────────────────────────
  create-release:
    name: 🏷️ Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: ScreenMirror-Release-${{ github.ref_name }}

      - name: List files
        run: ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ScreenMirror-*.apk
          generate_release_notes: true
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
